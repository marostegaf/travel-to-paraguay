<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/favicon.svg" type="image/x-icon">
    <title>Travel to Paraguay</title>
</head>
<body>
    <header class="header-bg">
        <div class="header container">
            <div class="logo">
                <a href="/index.html"><img src="img/logo.svg" alt=""></a>
            </div>
            <div class="configuracoes">
                <a href="/settings.html"><img src="img/configuracoes.svg" alt=""></a>
            </div>
        </div>
    </header>
    <section class="settings-bg">
        <form class="settings container" id="settings-form">
            <fieldset>
                <label class="font-manrope" for="spread">Spread</label>
                <input class="font-manrope" type="number" step="0.01" min="0" name="spread" id="spread" required>
            </fieldset>
            <fieldset>
                <label class="font-manrope" for="iof">IOF</label>
                <input class="font-manrope" type="number" step="0.01" min="0" name="iof" id="iof" required>
            </fieldset>
            <fieldset>
                <label class="font-manrope" for="ptax">PTAX</label>
                <input class="font-manrope" type="number" step="0.01" min="0" name="ptax" id="ptax" required>
            </fieldset>
            <button class="font-manrope" type="submit">Salvar</button>
        </form>
    </section>
    <footer class="footer-bg">
        <div class="footer container">
            <p class="font-roboto">Todos os direitos reservados. ©</p>
        </div>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
