<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/favcon.svg" type="image/x-icon">
    <title>Travel to Paraguay</title>
</head>
<body>
    <header class="header-bg">
        <div class="header container">
            <div class="logo">
                <img src="img/logo.svg" alt="">
            </div>
            <div class="configuracoes">
                <img src="img/configuracoes.svg" alt="">
            </div>
        </div>
    </header>
    <section class="main-bg">
        <div class="main container">
            <div class="main-botoes">
                <form action="">
                    <div class="input-div font-manrope">
                        <input class="main-botao font-manrope" type="text" name="valor" placeholder="00.00" required>
                    </div>
                    <button class="main-botao font-manrope" type="submit">Calcular</button>
                </form>
            </div>
            <div class="main-preco">
                <div class="preco-especifico">
                    <div class="preco-titulo">
                        <h4 class="font-roboto">Dólar Americano</h4>
                        <div>
                            <img src="img/usd.svg" alt="">
                        </div>
                    </div>
                    <h2 class="font-inter">00.00</h2>
                    <div class="preco-informacoes">
                        <div class="informacao">
                            <p class="font-manrope">Spread</p>
                            <span class="font-manrope">0.0%</span>
                        </div>
                        <div class="informacao">
                            <p class="font-manrope">IOF</p>
                            <span class="font-manrope">0.0%</span>
                        </div>
                        <div class="informacao">
                            <p class="font-manrope">PTAX</p>
                            <span class="font-manrope">R$ 00,00</span>
                        </div>
                    </div>
                </div>
                <div class="preco-especifico">
                    <div class="preco-titulo">
                        <h4 class="font-roboto">Real Brasileiro</h4>
                        <div>
                            <img src="img/brl.svg" alt="">
                        </div>
                    </div>
                    <h2 class="font-inter">00,00</h2>
                    <div class="preco-informacoes">
                        <div class="informacao">
                            <p class="font-manrope">Spread</p>
                            <span class="font-manrope">0.0%</span>
                        </div>
                        <div class="informacao">
                            <p class="font-manrope">IOF</p>
                            <span class="font-manrope">0.0%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer-bg">
        <div class="footer container">
            <p class="font-roboto">Todos os direitos reservados. ©</p>
        </div>
    </footer>
</body>
</html>
